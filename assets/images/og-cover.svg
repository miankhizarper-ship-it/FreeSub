  <text x="90" y="455" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="66" font-weight="800" fill="#4f46e5">a real name.</text>
  <text x="90" y="515" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="27" font-weight="500" fill="#475569">Free subdomains on kharcha.info — no credit card, no hosting lock-in.</text>
